name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r src/requirements.txt ruff pytest pytest-cov

      # report-only for now: existing (pre-framework) code has ~88 pre-existing
      # ruff findings never cleaned up. Revert to a hard-fail step once a tech-debt
      # story clears them and project-profile.yaml `quality.lint_zero_tolerance` is true again.
      - name: Lint (report-only, see project-profile.yaml quality.lint_zero_tolerance)
        run: ruff check . || true

      - name: Test + coverage gate
        run: pytest src/tests --cov=src --cov-report=term-missing --cov-fail-under=85 -q

  e2e:
    name: e2e (Playwright, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (for local e2e_server.py)
        run: pip install -r src/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      # npm ci 已透過 package.json 的 postinstall script
      # (`playwright install --with-deps chromium`，見 SDLCAIP2-4 設計文件
      # 決策 6) 自動安裝 Chromium + 系統相依套件，此處不需要重複的
      # `npx playwright install` 步驟。

      - name: Run Playwright e2e tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
