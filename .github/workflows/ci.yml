name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r src/requirements.txt ruff pytest pytest-cov

      - name: Lint
        run: ruff check .

      - name: Test + coverage gate
        run: pytest src/tests --cov=src --cov-report=term-missing --cov-fail-under=70 -q
