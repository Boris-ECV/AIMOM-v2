name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r src/requirements.txt ruff pytest pytest-cov

      # report-only for now: existing (pre-framework) code has ~88 pre-existing
      # ruff findings never cleaned up. Revert to a hard-fail step once a tech-debt
      # story clears them and project-profile.yaml `quality.lint_zero_tolerance` is true again.
      - name: Lint (report-only, see project-profile.yaml quality.lint_zero_tolerance)
        run: ruff check . || true

      - name: Test + coverage gate
        run: pytest src/tests --cov=src --cov-report=term-missing --cov-fail-under=85 -q

  e2e:
    name: e2e (Playwright, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (for local e2e_server.py)
        run: pip install -r src/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      # npm ci 已透過 package.json 的 postinstall script
      # (`playwright install --with-deps chromium`，見 SDLCAIP2-4 設計文件
      # 決策 6) 自動安裝 Chromium + 系統相依套件，此處不需要重複的
      # `npx playwright install` 步驟。

      - name: Run Playwright e2e tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  backend:
    name: Deploy backend (terraform apply)
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    outputs:
      frontend_bucket_name: ${{ steps.tf_outputs.outputs.frontend_bucket_name }}
      cloudfront_distribution_id: ${{ steps.tf_outputs.outputs.cloudfront_distribution_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.TF_STATE_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda layer
        run: bash scripts/build_lambda_layer.sh

      - name: Reconstruct infra/backend.hcl
        run: |
          cat > infra/backend.hcl <<EOF
          bucket = "${{ secrets.TF_STATE_BUCKET }}"
          key    = "${{ secrets.TF_STATE_KEY }}"
          region = "${{ secrets.TF_STATE_REGION }}"
          encrypt = true
          use_lockfile = true
          EOF

      - name: terraform init
        working-directory: infra
        run: terraform init -backend-config=backend.hcl -input=false

      - name: terraform apply
        working-directory: infra
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_google_client_id: ${{ secrets.TF_VAR_google_client_id }}
          TF_VAR_google_client_secret: ${{ secrets.TF_VAR_google_client_secret }}
          TF_VAR_admin_emails: ${{ secrets.TF_VAR_admin_emails }}
          TF_VAR_github_token: ${{ secrets.TF_VAR_github_token }}
          TF_VAR_openai_api_key: ${{ secrets.TF_VAR_openai_api_key }}
          TF_VAR_groq_api_key: ${{ secrets.TF_VAR_groq_api_key }}
          TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_gemini_api_key }}
          TF_VAR_bedrock_proxy_base_url: ${{ secrets.TF_VAR_bedrock_proxy_base_url }}
          TF_VAR_bedrock_proxy_api_key: ${{ secrets.TF_VAR_bedrock_proxy_api_key }}
          TF_VAR_assemblyai_api_key: ${{ secrets.TF_VAR_assemblyai_api_key }}
          TF_VAR_frontend_callback_urls: ${{ vars.FRONTEND_CALLBACK_URLS }}
          TF_VAR_frontend_logout_urls: ${{ vars.FRONTEND_LOGOUT_URLS }}

      - name: Export terraform outputs for downstream jobs
        id: tf_outputs
        working-directory: infra
        run: |
          echo "frontend_bucket_name=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

  frontend:
    name: Deploy frontend (S3 sync + CloudFront invalidation)
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.TF_STATE_REGION }}

      - name: Sync frontend to S3
        run: |
          aws s3 sync src/frontend/ s3://${{ needs.backend.outputs.frontend_bucket_name }}/ \
            --exclude ".DS_Store" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.backend.outputs.cloudfront_distribution_id }} \
            --paths "/*"
